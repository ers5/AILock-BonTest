<!doctype html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AILock 관리자 로그인</title>
    <style>
        :root {
            color-scheme: light;
            --bg: #f4f4f1;
            --panel: #ffffff;
            --text: #171717;
            --muted: #66635d;
            --border: #c5c2ba;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: var(--bg);
            color: var(--text);
            font-family: Pretendard, "Noto Sans KR", "Apple SD Gothic Neo", system-ui, sans-serif;
        }

        .login-card {
            width: min(26rem, calc(100vw - 2rem));
            padding: 1.5rem;
            border: 1px solid var(--border);
            background: var(--panel);
        }

        h1 {
            margin: 0 0 0.5rem;
            font-size: 1.5rem;
        }

        p {
            margin: 0 0 1rem;
            color: var(--muted);
            line-height: 1.5;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-size: 0.875rem;
            color: var(--muted);
        }

        input {
            width: 100%;
            height: 2.75rem;
            padding: 0 0.875rem;
            border: 1px solid var(--border);
            background: #fff;
            color: var(--text);
            font: inherit;
        }

        button {
            width: 100%;
            height: 2.75rem;
            margin-top: 0.875rem;
            border: 1px solid var(--text);
            background: var(--text);
            color: #fff;
            font: inherit;
            cursor: pointer;
        }

        .message {
            min-height: 1.5rem;
            margin-top: 0.75rem;
            font-size: 0.875rem;
            color: #a12c2c;
        }
    </style>
</head>
<body>
<main class="login-card">
    <h1>관리자 로그인</h1>
    <p>admin 페이지를 보려면 비밀번호를 입력해주세요.</p>
    <form id="loginForm" method="post" action="/admin/login">
        <label for="password">비밀번호</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
        <button type="submit">들어가기</button>
        <div id="message" class="message" aria-live="polite"></div>
    </form>
</main>
<script src="/admin/login.js"></script>
</body>
</html>
